<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnRen — Connexion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #111111;
            --ink-soft: #5A5A5A;
            --gold: #B08D2B;
            --gold-soft: #C9A94D;
            --line: #1A1A1A;
            --line-faint: rgba(17,17,17,0.10);
            --white: #FFFFFF;
            --off: #FAFAFA;
            --error: #C62828;
            --error-bg: #FDECEC;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter","Helvetica Neue",Arial,sans-serif;
            background: var(--white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            position: relative;
            overflow: hidden;
        }

        .bg-motif {
            position: absolute;
            inset: 0;
            opacity: 1;
            pointer-events: none;
        }

        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 20px 32px;
            z-index: 2;
            border-bottom: 1px solid var(--line-faint);
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(4px);
        }

        .logo-badge {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1.5px solid var(--line);
            overflow: hidden;
        }

            .logo-badge svg {
                width: 24px;
                height: 24px;
            }

            .logo-badge img {
                max-width: 26px;
                max-height: 26px;
                width: 26px;
                height: 26px;
                object-fit: contain;
            }

        .topbar-text {
            color: var(--ink);
            line-height: 1.25;
        }

            .topbar-text .h1 {
                font-size: 15px;
                font-weight: 700;
                letter-spacing: 0.1px;
            }

            .topbar-text .h2 {
                font-size: 11.5px;
                font-weight: 400;
                color: var(--ink-soft);
                letter-spacing: 0.2px;
            }

        .card {
            position: relative;
            z-index: 2;
            background: var(--white);
            width: 100%;
            max-width: 440px;
            border-radius: 12px;
            padding: 46px 40px 36px;
            margin-top: 64px;
            border: 1px solid var(--line);
            box-shadow: 0 24px 60px rgba(17,17,17,0.08);
        }

            .card::before {
                content: "";
                position: absolute;
                top: 9px;
                left: 9px;
                right: 9px;
                bottom: 9px;
                border: 1px solid var(--gold-soft);
                border-radius: 10px;
                pointer-events: none;
                opacity: 0.55;
            }

        .brand-mark {
            text-align: center;
            font-size: 29px;
            font-weight: 900;
            letter-spacing: 0.3px;
            color: var(--ink);
            margin-bottom: 26px;
        }

            .brand-mark span {
                color: var(--gold);
            }

        h1.title {
            font-size: 21px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 6px;
            text-align: center;
        }

        p.subtitle {
            font-size: 13.5px;
            font-weight: 400;
            color: var(--ink-soft);
            margin-bottom: 28px;
            text-align: center;
        }

        label {
            display: block;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--ink);
            margin-bottom: 7px;
            letter-spacing: 0.2px;
        }

        .field {
            margin-bottom: 18px;
        }

        .input-box {
            display: flex;
            align-items: center;
            gap: 9px;
            width: 100%;
            border: 1.5px solid var(--line-faint);
            border-radius: 8px;
            background: var(--off);
            padding: 0 13px;
            transition: border-color 0.15s ease, background 0.15s ease;
        }

            .input-box:focus-within {
                border-color: var(--gold);
            }

            .input-box svg.field-icon {
                flex: 0 0 auto;
                width: 16px;
                height: 16px;
                color: var(--ink-soft);
                pointer-events: none;
            }

            .input-box input {
                flex: 1 1 auto;
                min-width: 0;
                width: 100%;
                font-family: "Inter","Helvetica Neue",Arial,sans-serif;
                font-size: 16px;
                padding: 11px 0;
                border: none;
                background: transparent;
                color: var(--ink);
                outline: none;
            }

        input::placeholder {
            color: #A3A3A3;
        }

        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear {
            display: none;
        }

        .field.error .input-box {
            border-color: var(--error);
            background: var(--error-bg);
            animation: shake 0.4s ease;
        }

            .field.error .input-box svg.field-icon {
                color: var(--error);
            }

        .error-msg {
            display: none;
            font-size: 12px;
            color: var(--error);
            margin-top: 6px;
            font-weight: 500;
        }

        .field.error .error-msg {
            display: block;
        }

        @keyframes shake {
            10%,90% {
                transform: translateX(-1px);
            }

            20%,80% {
                transform: translateX(2px);
            }

            30%,50%,70% {
                transform: translateX(-3px);
            }

            40%,60% {
                transform: translateX(3px);
            }
        }

        .pw-toggle {
            flex: 0 0 auto;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--ink-soft);
            display: flex;
            align-items: center;
            padding: 4px;
            border-radius: 3px;
            transition: color 0.15s ease;
        }

            .pw-toggle:hover {
                color: var(--gold);
            }

            .pw-toggle:focus-visible {
                outline: 2px solid var(--gold);
                outline-offset: 1px;
            }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin: 4px 0 26px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--ink-soft);
            font-weight: 400;
        }

            .remember input {
                width: 14px;
                height: 14px;
                accent-color: var(--ink);
            }

        .link {
            color: var(--ink);
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px solid var(--gold);
        }

            .link:hover {
                color: var(--gold);
            }

        button.submit {
            width: 100%;
            background: var(--ink);
            color: var(--white);
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-family: "Inter","Helvetica Neue",Arial,sans-serif;
            font-size: 13.5px;
            font-weight: 700;
            letter-spacing: 0.8px;
            cursor: pointer;
            transition: background 0.15s ease;
        }

            button.submit:hover {
                background: var(--gold);
            }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0 18px;
            font-size: 12px;
            font-weight: 400;
            color: var(--ink-soft);
        }

            .divider::before, .divider::after {
                content: "";
                flex: 1;
                height: 1px;
                background: var(--line-faint);
            }

        .signup {
            text-align: center;
            font-size: 13px;
            font-weight: 400;
            color: var(--ink-soft);
        }

        @media (max-width:480px) {
            .topbar {
                padding: 12px 16px;
                gap: 10px;
            }

            .logo-badge {
                width: 34px;
                height: 34px;
            }

                .logo-badge img {
                    width: 20px;
                    height: 20px;
                }

            .topbar-text .h1 {
                font-size: 12.5px;
            }

            .topbar-text .h2 {
                font-size: 10px;
            }

            .card {
                margin-top: 96px;
                padding: 32px 22px 28px;
            }

            .brand-mark {
                font-size: 24px;
                margin-bottom: 20px;
            }

            h1.title {
                font-size: 18px;
            }

            p.subtitle {
                font-size: 12.5px;
                margin-bottom: 22px;
            }
        }
    </style>
</head>
<body>

    <svg class="bg-motif" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
        <circle cx="1180" cy="180" r="260" fill="none" stroke="#111111" stroke-width="1.5" opacity="0.16" />
        <circle cx="1180" cy="180" r="200" fill="none" stroke="#B08D2B" stroke-width="1.5" opacity="0.22" />
        <circle cx="1180" cy="180" r="340" fill="none" stroke="#B08D2B" stroke-width="1" stroke-dasharray="3 6" opacity="0.16" />
        <polygon points="1180,-20 1440,420 920,420" fill="none" stroke="#111111" stroke-width="1.25" stroke-dasharray="5 7" opacity="0.16" />

        <circle cx="120" cy="800" r="220" fill="none" stroke="#111111" stroke-width="1.5" opacity="0.15" />
        <circle cx="120" cy="800" r="160" fill="none" stroke="#B08D2B" stroke-width="1.5" opacity="0.20" />
        <circle cx="120" cy="800" r="290" fill="none" stroke="#111111" stroke-width="1" stroke-dasharray="3 6" opacity="0.14" />

        <line x1="0" y1="620" x2="1440" y2="620" stroke="#111111" stroke-width="1" opacity="0.14" />
        <line x1="0" y1="640" x2="1440" y2="640" stroke="#B08D2B" stroke-width="1" opacity="0.16" />

        <line x1="-100" y1="40" x2="560" y2="700" stroke="#111111" stroke-width="1.25" opacity="0.15" />
        <line x1="-60" y1="0" x2="600" y2="660" stroke="#B08D2B" stroke-width="1" opacity="0.14" />
        <line x1="900" y1="-60" x2="1560" y2="600" stroke="#111111" stroke-width="1.25" opacity="0.15" />
        <line x1="940" y1="-40" x2="1600" y2="620" stroke="#B08D2B" stroke-width="1" opacity="0.14" />
        <line x1="980" y1="900" x2="1560" y2="320" stroke="#111111" stroke-width="1.25" opacity="0.14" />
        <line x1="-40" y1="900" x2="480" y2="380" stroke="#B08D2B" stroke-width="1" opacity="0.13" />

        <line x1="0" y1="220" x2="400" y2="220" stroke="#111111" stroke-width="1.25" opacity="0.17" />
        <line x1="0" y1="240" x2="400" y2="240" stroke="#111111" stroke-width="1" stroke-dasharray="4 6" opacity="0.16" />
        <line x1="1040" y1="740" x2="1440" y2="740" stroke="#111111" stroke-width="1.25" opacity="0.17" />
        <line x1="1040" y1="760" x2="1440" y2="760" stroke="#111111" stroke-width="1" stroke-dasharray="4 6" opacity="0.16" />
        <line x1="0" y1="90" x2="260" y2="90" stroke="#B08D2B" stroke-width="1" opacity="0.15" />
        <line x1="1180" y1="830" x2="1440" y2="830" stroke="#B08D2B" stroke-width="1" opacity="0.15" />

        <line x1="680" y1="0" x2="680" y2="70" stroke="#111111" stroke-width="1.25" opacity="0.16" />
        <line x1="760" y1="830" x2="760" y2="900" stroke="#111111" stroke-width="1.25" opacity="0.16" />
        <line x1="40" y1="380" x2="40" y2="520" stroke="#B08D2B" stroke-width="1" opacity="0.14" />
        <line x1="1400" y1="380" x2="1400" y2="520" stroke="#B08D2B" stroke-width="1" opacity="0.14" />

        <circle cx="700" cy="450" r="4" fill="#B08D2B" opacity="0.30" />
        <circle cx="300" cy="150" r="3" fill="#111111" opacity="0.22" />
        <circle cx="1350" cy="700" r="3" fill="#111111" opacity="0.22" />
    </svg>

    <div class="topbar">
        <div class="logo-badge">
            <img src="cud-logo.png" alt="Logo CUD" style="width:26px;height:26px;object-fit:contain;display:block;">
        </div>
        <div class="topbar-text">
            <div class="h1">Communauté Urbaine de Douala</div>
            <div class="h2">Régie des Routes et de la Construction</div>
        </div>
    </div>

    <div class="card">
        <div class="brand-mark">An<span>Ren</span></div>
        <h1 class="title">Espace de connexion</h1>
        <p class="subtitle">Accédez à votre compte ou administrateur.</p>

        <div class="field" id="anren-emailField">
            <label for="anren-email">Identifiant</label>
            <div class="input-box">
                <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <rect x="2" y="4" width="20" height="16" rx="2" />
                    <path d="M2 6l10 7 10-7" />
                </svg>
                <input type="text" id="anren-email" placeholder="Identifiant" autocomplete="username">
            </div>
            <div class="error-msg" id="anren-emailError">Veuillez saisir votre identifiant.</div>
        </div>

        <div class="field" id="anren-passwordField">
            <label for="anren-password">Mot de passe</label>
            <div class="input-box">
                <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <rect x="4" y="10" width="16" height="10" rx="2" />
                    <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                </svg>
                <input type="password" id="anren-password" placeholder="••••••••">
                <button class="pw-toggle" id="anren-pwToggle" type="button" aria-label="Afficher le mot de passe">
                    <svg id="anren-eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </button>
            </div>
            <div class="error-msg" id="anren-passwordError">Le mot de passe est requis.</div>
        </div>

        <div class="row">
            <label class="remember"><input type="checkbox"> Se souvenir de moi</label>
            <a class="link" href="#">Mot de passe oublié ?</a>
        </div>

        <button class="submit" id="anren-submitBtn" type="button">SE CONNECTER</button>

        <div class="divider">ou</div>

        <p class="signup">Pas encore de compte ? <a class="link" href="pagedecreation.html">Créer un compte</a></p>
    </div>

    <script>
        const pwToggle = document.getElementById('anren-pwToggle');
        const passwordInput = document.getElementById('anren-password');
        const eyeIcon = document.getElementById('anren-eyeIcon');

        const EYE_OPEN = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
        const EYE_CLOSED = '<path d="M3 3l18 18"/><path d="M10.6 10.6a3 3 0 0 0 4.24 4.24"/><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a17.6 17.6 0 0 1-3.09 4.09M6.1 6.1A17.5 17.5 0 0 0 1 11s4 7 11 7a10.9 10.9 0 0 0 4.9-1.14"/>';

        pwToggle.addEventListener('mousedown', (e) => {
            e.preventDefault();
        });

        pwToggle.addEventListener('click', () => {
            const showing = passwordInput.type === 'text';
            passwordInput.type = showing ? 'password' : 'text';
            eyeIcon.innerHTML = showing ? EYE_OPEN : EYE_CLOSED;
            pwToggle.setAttribute('aria-label', showing ? 'Afficher le mot de passe' : 'Masquer le mot de passe');
        });

        const emailInput = document.getElementById('anren-email');
        const emailField = document.getElementById('anren-emailField');
        const passwordField = document.getElementById('anren-passwordField');

        function setError(field, hasError) {
            field.classList.remove('error');
            if (hasError) {
                void field.offsetWidth;
                field.classList.add('error');
            }
        }

        function validateEmail() {
            const value = emailInput.value.trim();
            const valid = value.length > 0;
            setError(emailField, !valid);
            return valid;
        }

        function validatePassword() {
            const valid = passwordInput.value.length > 0;
            setError(passwordField, !valid);
            return valid;
        }

        emailInput.addEventListener('blur', validateEmail);
        passwordInput.addEventListener('blur', validatePassword);
        emailInput.addEventListener('input', () => { if (emailField.classList.contains('error')) validateEmail(); });
        passwordInput.addEventListener('input', () => { if (passwordField.classList.contains('error')) validatePassword(); });

        document.getElementById('anren-submitBtn').addEventListener('click', () => {
            const emailOk = validateEmail();
            const passwordOk = validatePassword();
            if (emailOk && passwordOk) {
                
            }
        });
    </script>

</body>
</html>
