<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnRen — Connexion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Login.css">
</head>
<body>

    <svg class="bg-motif" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
        <circle cx="1180" cy="180" r="260" fill="none" stroke="#111111" stroke-width="1.5" opacity="0.16" />
        <circle cx="1180" cy="180" r="200" fill="none" stroke="#B08D2B" stroke-width="1.5" opacity="0.22" />
        <circle cx="1180" cy="180" r="340" fill="none" stroke="#B08D2B" stroke-width="1" stroke-dasharray="3 6" opacity="0.16" />
        <polygon points="1180,-20 1440,420 920,420" fill="none" stroke="#111111" stroke-width="1.25" stroke-dasharray="5 7" opacity="0.16" />

        <circle cx="120" cy="800" r="220" fill="none" stroke="#111111" stroke-width="1.5" opacity="0.15" />
        <circle cx="120" cy="800" r="160" fill="none" stroke="#B08D2B" stroke-width="1.5" opacity="0.20" />
        <circle cx="120" cy="800" r="290" fill="none" stroke="#111111" stroke-width="1" stroke-dasharray="3 6" opacity="0.14" />

        <line x1="0" y1="620" x2="1440" y2="620" stroke="#111111" stroke-width="1" opacity="0.14" />
        <line x1="0" y1="640" x2="1440" y2="640" stroke="#B08D2B" stroke-width="1" opacity="0.16" />

        <line x1="-100" y1="40" x2="560" y2="700" stroke="#111111" stroke-width="1.25" opacity="0.15" />
        <line x1="-60" y1="0" x2="600" y2="660" stroke="#B08D2B" stroke-width="1" opacity="0.14" />
        <line x1="900" y1="-60" x2="1560" y2="600" stroke="#111111" stroke-width="1.25" opacity="0.15" />
        <line x1="940" y1="-40" x2="1600" y2="620" stroke="#B08D2B" stroke-width="1" opacity="0.14" />
        <line x1="980" y1="900" x2="1560" y2="320" stroke="#111111" stroke-width="1.25" opacity="0.14" />
        <line x1="-40" y1="900" x2="480" y2="380" stroke="#B08D2B" stroke-width="1" opacity="0.13" />

        <line x1="0" y1="220" x2="400" y2="220" stroke="#111111" stroke-width="1.25" opacity="0.17" />
        <line x1="0" y1="240" x2="400" y2="240" stroke="#111111" stroke-width="1" stroke-dasharray="4 6" opacity="0.16" />
        <line x1="1040" y1="740" x2="1440" y2="740" stroke="#111111" stroke-width="1.25" opacity="0.17" />
        <line x1="1040" y1="760" x2="1440" y2="760" stroke="#111111" stroke-width="1" stroke-dasharray="4 6" opacity="0.16" />
        <line x1="0" y1="90" x2="260" y2="90" stroke="#B08D2B" stroke-width="1" opacity="0.15" />
        <line x1="1180" y1="830" x2="1440" y2="830" stroke="#B08D2B" stroke-width="1" opacity="0.15" />

        <line x1="680" y1="0" x2="680" y2="70" stroke="#111111" stroke-width="1.25" opacity="0.16" />
        <line x1="760" y1="830" x2="760" y2="900" stroke="#111111" stroke-width="1.25" opacity="0.16" />
        <line x1="40" y1="380" x2="40" y2="520" stroke="#B08D2B" stroke-width="1" opacity="0.14" />
        <line x1="1400" y1="380" x2="1400" y2="520" stroke="#B08D2B" stroke-width="1" opacity="0.14" />

        <circle cx="700" cy="450" r="4" fill="#B08D2B" opacity="0.30" />
        <circle cx="300" cy="150" r="3" fill="#111111" opacity="0.22" />
        <circle cx="1350" cy="700" r="3" fill="#111111" opacity="0.22" />
    </svg>

    <div class="topbar">
        <div class="logo-badge">
            <img src="cud-logo.png" alt="Logo CUD" style="width:26px;height:26px;object-fit:contain;display:block;">
        </div>
        <div class="topbar-text">
            <div class="h1">Communauté Urbaine de Douala</div>
            <div class="h2">Régie des Routes et de la Construction</div>
        </div>
    </div>

    <div class="card">
        <a class="brand-mark" href="/Maquettes/pageaccueil.html">An<span>Ren</span></a>
        <h1 class="title">Connexion</h1>
        <p class="subtitle">Accédez à votre espace de gestion AnRen.</p>

        <div class="field" id="anren-loginField">
            <label for="anren-login">Identifiant</label>
            <div class="input-box">
                <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <circle cx="12" cy="8" r="4" />
                    <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" />
                </svg>
                <input type="text" id="anren-login" placeholder="Identifiant" autocomplete="username">
            </div>
            <div class="error-msg" id="anren-loginError">Veuillez saisir votre identifiant.</div>
        </div>

        <div class="field" id="anren-passwordField">
            <label for="anren-password">Mot de passe</label>
            <div class="input-box">
                <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <rect x="4" y="10" width="16" height="10" rx="2" />
                    <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                </svg>
                <input type="password" id="anren-password" placeholder="Mot de passe" autocomplete="current-password">
                <button class="pw-toggle" id="anren-pwToggle" type="button" aria-label="Afficher le mot de passe">
                    <svg id="anren-eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </button>
            </div>
            <div class="error-msg" id="anren-passwordError">Veuillez saisir votre mot de passe.</div>
        </div>

        <button class="submit" id="anren-submitBtn" type="button">SE CONNECTER</button>

        <a class="back-home" href="/Maquettes/pageaccueil.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5" />
                <path d="M11 18l-6-6 6-6" />
            </svg>
            Retour à l'accueil
        </a>
    </div>

    <script>
        const toggle = document.getElementById('anren-pwToggle');
        const input = document.getElementById('anren-password');
        const icon = document.getElementById('anren-eyeIcon');
        const EYE_OPEN = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
        const EYE_CLOSED = '<path d="M3 3l18 18"/><path d="M10.6 10.6a3 3 0 0 0 4.24 4.24"/><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a17.6 17.6 0 0 1-3.09 4.09M6.1 6.1A17.5 17.5 0 0 0 1 11s4 7 11 7a10.9 10.9 0 0 0 4.9-1.14"/>';

        toggle.addEventListener('mousedown', (e) => e.preventDefault());
        toggle.addEventListener('click', () => {
            const showing = input.type === 'text';
            input.type = showing ? 'password' : 'text';
            icon.innerHTML = showing ? EYE_OPEN : EYE_CLOSED;
        });

        const loginInput = document.getElementById('anren-login');
        const loginField = document.getElementById('anren-loginField');
        const passwordField = document.getElementById('anren-passwordField');

        function setError(field, hasError) {
            field.classList.remove('error');
            if (hasError) {
                void field.offsetWidth;
                field.classList.add('error');
            }
        }

        document.getElementById('anren-submitBtn').addEventListener('click', () => {
            const okLogin = loginInput.value.trim().length > 0;
            const okPass = input.value.length > 0;
            setError(loginField, !okLogin);
            setError(passwordField, !okPass);

            if (okLogin && okPass) {
                
            }
        });
    </script>

</body>
</html>
