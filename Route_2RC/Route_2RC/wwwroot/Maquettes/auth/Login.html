<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - AnRen</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="login-page-container">

    <div class="login-top-bar">
        <div class="login-top-brand">
            <img src="../assets/cud-logo.png" alt="Logo CUD" onerror="this.style.display='none'">
            <div class="login-top-text"><b>Communauté Urbaine de Douala</b><br>Régie des Routes et de la Construction</div>
        </div>
    </div>

    <div class="login-wrapper">
        <div class="login-card-exact">
            <a href="pageaccueil.html" class="back-link">← Retour à l'accueil</a>

            <div class="login-logo-title">An<span>Ren</span></div>
            <h2 class="login-title">Connexion</h2>
            <p class="login-subtitle">Saisissez vos identifiants pour accéder à votre espace.</p>

            <form id="loginForm" action="../dashboard/dashboard.html" method="GET" onsubmit="return validateLogin(event)">

                <div class="form-group-custom">
                    <label class="form-label-custom" for="identifiant">Adresse email ou Matricule</label>
                    <input type="text" id="identifiant" name="identifiant" class="form-input-custom" placeholder="ex: 2RC2026CUD001" autocomplete="username" required>
                    <div class="error-message-text">Veuillez renseigner ce champ.</div>
                </div>

                <div class="form-group-custom">
                    <label class="form-label-custom" for="password">Mot de passe</label>
                    <input type="password" id="password" class="form-input-custom" placeholder="••••••••••••" autocomplete="current-password" required>
                    <div class="error-message-text">Ce champ est requis.</div>
                </div>

                <button type="submit" class="btn-submit-custom">Se connecter</button>
            </form>

            <p class="login-note">
                Entrez toutes les informations nécessaire
            </p>
        </div>
    </div>

    <script src="../js/menu.js"></script>
</body>
</html>
